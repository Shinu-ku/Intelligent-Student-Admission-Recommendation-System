{% extends "base.html" %}

{% block title %}Sign In | Intelligent Student Admission System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card-glass p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-dark text-indigo mb-2 fs-3">
                        <i class="fas fa-lock"></i>
                    </div>
                    <h3 class="fw-bold text-white mb-1">Welcome Back</h3>
                    <p class="text-secondary small">Access your admission portal account</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fas fa-envelope"></i></span>
                            <input type="email" name="email" id="loginEmail" class="form-control form-control-dark" placeholder="student@example.com or admin@university.edu" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-secondary small fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fas fa-key"></i></span>
                            <input type="password" name="password" id="loginPassword" class="form-control form-control-dark" placeholder="Enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">
                        <i class="fas fa-sign-in-alt me-2"></i> Log In
                    </button>
                </form>

                <!-- Quick Demo Login Helpers -->
                <div class="mt-4 pt-3 border-top border-secondary text-center">
                    <p class="text-secondary small mb-2 fw-semibold">Quick Demo Login Shortcuts:</p>
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="button" class="btn btn-outline-info btn-sm rounded-pill" onclick="fillLogin('admin@university.edu', 'admin123')">
                            <i class="fas fa-user-shield me-1"></i> Admission Officer
                        </button>
                        <button type="button" class="btn btn-outline-success btn-sm rounded-pill" onclick="fillLogin('soumya@example.com', 'student123')">
                            <i class="fas fa-user-graduate me-1"></i> Student Demo
                        </button>
                    </div>
                </div>

                <div class="mt-4 text-center text-secondary small">
                    Don't have an account yet? <a href="{{ url_for('auth.register') }}" class="text-indigo text-decoration-none fw-semibold">Create Account</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillLogin(email, pwd) {
    document.getElementById('loginEmail').value = email;
    document.getElementById('loginPassword').value = pwd;
}
</script>
{% endblock %}
